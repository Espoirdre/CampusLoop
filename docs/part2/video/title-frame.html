<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --paper: #F5F0E6;
    --paper-2: #FBF7EE;
    --ink: #1B1712;
    --ink-2: #5C5346;
    --ink-3: #918776;
    --red: #B3432B;
    --serif: Georgia, "STZhongsong", "Songti SC", "SimSun", serif;
    --sans: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  html, body {
    width: 1920px; height: 1080px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 86px 120px;
    background:
      radial-gradient(1200px 600px at 50% 0%, #FBF7EE 0%, rgba(251,247,238,0) 70%),
      var(--paper);
  }
  /* 细线边框：编辑杂志风的骨架 */
  .frame {
    position: absolute; inset: 40px;
    border: 1px solid rgba(27,23,18,.16);
    pointer-events: none;
  }
  .frame::after {
    content: ""; position: absolute; inset: 9px;
    border: 1px solid rgba(27,23,18,.07);
  }

  .eyebrow {
    display: flex; align-items: center; gap: 20px;
    font-size: 19px; letter-spacing: .34em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 46px;
  }
  .eyebrow .bar { width: 54px; height: 1px; background: var(--red); }
  .eyebrow .zh { letter-spacing: .22em; color: var(--ink-2); }

  .badge {
    width: 150px; height: 150px; border-radius: 50%;
    display: block; margin-bottom: 30px;
    filter: drop-shadow(0 6px 16px rgba(27,23,18,.14));
  }

  h1 {
    font-family: var(--serif);
    font-size: 150px;
    line-height: .96;
    letter-spacing: -.022em;
    font-weight: 400;
  }
  h1 .loop { color: var(--red); }

  .tagline {
    margin-top: 26px;
    font-size: 30px;
    color: var(--ink-2);
    letter-spacing: .06em;
    font-family: var(--serif);
  }

  .divider {
    display: flex; align-items: center; gap: 18px;
    margin: 44px 0 34px;
    width: 720px;
  }
  .divider i { flex: 1; height: 1px; background: rgba(27,23,18,.22); }
  .divider span {
    font-size: 15px; letter-spacing: .3em; color: var(--ink-3);
    text-transform: uppercase;
  }

  .group {
    font-size: 40px; letter-spacing: .1em; margin-bottom: 30px;
  }
  .group b { font-weight: 600; }
  .group em {
    font-style: normal; font-size: 22px; color: var(--ink-3);
    letter-spacing: .16em; margin-left: 16px;
  }

  .members {
    display: flex; align-items: center; gap: 0;
    font-size: 25px; color: var(--ink);
  }
  .members span { padding: 0 22px; border-right: 1px solid rgba(27,23,18,.2); }
  .members span:last-child { border-right: 0; }
  .members small {
    display: block; font-size: 15px; color: var(--ink-3);
    letter-spacing: .12em; margin-top: 7px; font-family: var(--serif);
  }

  .foot {
    position: absolute; left: 0; right: 0; bottom: 74px;
    display: flex; justify-content: space-between;
    padding: 0 122px;
    font-size: 17px; color: var(--ink-3); letter-spacing: .12em;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="frame"></div>

    <div class="eyebrow">
      <span class="bar"></span>
      <span>Final Group Project &nbsp;·&nbsp; Part 2 &nbsp;·&nbsp; Demo Day</span>
      <span class="zh">期末小组项目 · 成果展示</span>
    </div>

    <img class="badge" src="../../../assets/logo-mark-512.png" alt="">

    <h1>Campus<span class="loop">Loop</span></h1>
    <div class="tagline">丢的东西，找得到；闲的东西，流动起来。</div>

    <div class="divider">
      <i></i><span>Team</span><i></i>
    </div>

    <div class="group"><b>奶龙 Vibe 编码局</b><em>NAILONG VIBE CODING BUREAU</em></div>

    <div class="members">
      <span>张铖轩<small>26100164</small></span>
      <span>陈思峥<small>26100014</small></span>
      <span>高斌雄<small>26100031</small></span>
      <span>嵇翰林<small>26100048</small></span>
      <span>马桢豪<small>26100096</small></span>
    </div>

    <div class="foot">
      <span>2026 年 12 月</span>
      <span>Building Agentic AI Products with Vibe Coding</span>
    </div>
  </div>
</body>
</html>
