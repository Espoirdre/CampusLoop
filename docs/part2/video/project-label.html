<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 592px; height: 128px;
    background: transparent;
    overflow: hidden;
    padding: 16px;
    font-family: Georgia, "Microsoft YaHei", serif;
  }
  .label {
    width: 560px; height: 96px;
    display: flex; align-items: center; gap: 18px;
    padding: 0 26px;
    background: rgba(245, 240, 230, .90);
    border: 2px solid #1B1712;
    border-radius: 3px;
  }
  .label img { width: 52px; height: 52px; border-radius: 50%; display: block; }
  .txt { display: flex; flex-direction: column; gap: 3px; }
  .name {
    font-size: 34px; line-height: 1; color: #1B1712;
    letter-spacing: .012em;
  }
  .name i { font-style: normal; color: #B3432B; }
  .sub {
    font-family: "Microsoft YaHei", sans-serif;
    font-size: 15px; color: #5C5346; letter-spacing: .18em;
  }
</style>
</head>
<body>
  <div class="label">
    <img src="../../../assets/logo-mark-192.png" alt="">
    <div class="txt">
      <div class="name">Campus<i>Loop</i></div>
      <div class="sub">奶龙 Vibe 编码局</div>
    </div>
  </div>
</body>
</html>
